# 監視したい商品とサイトの一覧。
#
# 商品を増やしたいとき:
#   - products の下に新しい項目を追加するだけでOK。
#
# 監視サイトを増やしたいとき:
#   1. checkers/ フォルダに新しいチェッカー（例: yodobashi.py）を作る
#   2. check_stock.py の CHECKERS 辞書に登録する
#   3. ここの sites に site: "yodobashi" として追加する
#
# 各サイトの item:
#   site      : checkers/ 内のモジュール名
#   url       : （kaago, rakuten で使用）監視したいショップの商品ページURL
#   keyword   : （rakuten_search で使用）検索キーワード
#   required_keywords : （rakuten_search で使用）無関係な商品を除外するための
#                        必須キーワード（空白の有無は自動で吸収される）
#   price_min / price_max : 価格帯で絞り込みたい場合のみ指定
#
# 注記: Kaago(kaago.com)は1つのURLに全ショップの価格が集約されて
# いるわけではなく、ショップごとに個別の商品ページがある。そのため
# 同じ商品でも複数のショップURLを別々の項目として登録している。
# （Kaagoは検索結果ページのURLがまだ確認できていないため、この方式のまま）
#
# 注記2: 楽天市場は rakuten_search（検索結果ページを丸ごと見る方式）に
# 統一した。個別ショップのURLを登録する必要がなく、新しく出品を始めた
# ショップも自動的に拾える。
#
# 注記3: キヤノン公式・ヤマダウェブコム・ビックカメラはBot対策で
# GitHub Actionsからの取得がブロックされる（または不安定な誤検知を返す）
# ことが確認できたため、この3サイトの監視は SIGNAL WebAlert 側に任せている。

