name: Canon G7X Mark III 在庫チェック

on:
  schedule:
    # 5分おき（GitHub側の混雑状況によりさらに遅れることがあります）
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # 手動実行もできるようにしておく

# 前の実行が終わる前に次の実行が重なると state.json の push が
# 衝突するため、同時に1つしか走らないようにする。
concurrency:
  group: check-stock
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    permissions:
      contents: write # state.json をコミットし直すために必要
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージのインストール
        run: pip install -r requirements.txt

      - name: 在庫チェック実行
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: python check_stock.py

      - name: 状態ファイル(state.json)をコミット
        run: |
          git config user.name "stock-checker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "update state.json [skip ci]"
          # 他の実行が先にpushしている場合に備えて、pullしてからpushする
          git pull --rebase origin main
          git push
